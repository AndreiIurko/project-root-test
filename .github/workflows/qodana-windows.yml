name: Qodana Windows
on:
  workflow_dispatch:
  push:
jobs:
  qodana-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 'Qodana Backend (Windows, native)'
        uses: JetBrains/qodana-action@main
        with:
          args: --source-directory java-part --linter qodana-jvm --within-docker false
          upload-result: true
          artifact-name: qodana-windows
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_BACKEND }}
